name: Build and Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:       # manual trigger from the Actions UI

jobs:
  build:
    name: Build & Test (.NET ${{ matrix.dotnet }})
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        dotnet: [ "8.0.x" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ matrix.dotnet }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Restore dependencies
        run: dotnet restore src/IniDotNet.sln

      - name: Build
        run: dotnet build src/IniDotNet.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test src/IniDotNet.Tests/IniDotNet.Tests.csproj --no-build --configuration Release --verbosity normal
